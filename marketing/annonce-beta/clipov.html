<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Jakarta'; font-weight: 800; src: url(a/plus-jakarta-sans-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Script'; src: url(a/kaushan-script-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Mono'; font-weight: 600; src: url(a/jetbrains-mono-latin-600-normal.woff2) format('woff2'); }
html, body { margin: 0; width: 1080px; height: 1350px; background: transparent; color: #fff; }
.top { position: absolute; left: 0; right: 0; top: 66px; text-align: center; }
.mono { font: 600 26px 'Mono'; letter-spacing: 0.24em; text-transform: uppercase; text-shadow: 0 2px 16px #1e2278cc; margin: 0 0 14px; }
h2 { margin: 0; font: 800 96px 'Jakarta'; letter-spacing: -0.035em; text-shadow: 0 6px 40px #1e2278cc; }
.script { font-family: 'Script'; font-weight: 400; letter-spacing: 0; display: inline-block; position: relative; transform: rotate(-4deg); font-size: 1.15em; text-shadow: 0 0 40px #ff5fa2aa; }
.script::after { content: ''; position: absolute; left: 4%; right: 6%; bottom: -0.1em; height: 0.085em; border-radius: 99px; background: linear-gradient(90deg, #ff5fa2, #ff7a7a, #ffb37a); box-shadow: 0 0 20px #ff5fa2aa; }
.bottom { position: absolute; left: 0; right: 0; top: 1060px; text-align: center; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 99px; background: #3ee07f22; border: 2px solid #3ee07f; color: #d8ffe6; font: 800 30px 'Jakarta'; }
.pill i { width: 14px; height: 14px; border-radius: 50%; background: #3ee07f; box-shadow: 0 0 14px #3ee07f; }
</style></head><body>
<div class="top"><p class="mono">Vol VT 2026 · Décollage</p><h2>Cap sur le <span class="script">Village !</span></h2></div>
<div class="bottom"><span class="pill"><i></i>Embarquement immédiat</span></div>
</body></html>
